# Avrana fork: build the image from an avrana/* branch, only after this repository's own CI passed on that commit.
# Image: ghcr.io/<owner>/shelfarr:<branch>-<sha7> (linux/amd64, the avrana host). Deploys pin it BY DIGEST, which
# this job writes to the run summary. Nothing here runs for upstream branches.
name: Avrana image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["avrana/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - id: tag
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          safe=$(printf '%s' "$BRANCH" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')
          echo "tag=${safe}-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')/shelfarr" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Digest
        run: |
          echo "### ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '`${{ steps.tag.outputs.image }}@${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
